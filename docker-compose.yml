services:
  budget:
    image: ghcr.io/yannickpulver/budget:latest
    # build: .   # uncomment to build from source (and comment out the image line above)
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      # Persists the SQLite database (and its -wal/-shm files) on the host.
      - ./data:/data
    environment:
      - DATABASE_PATH=/data/budget.db
      # Enables /api/v1 for the CLI; read from .env next to this compose file.
      - API_TOKEN=${API_TOKEN:-}
    restart: unless-stopped
